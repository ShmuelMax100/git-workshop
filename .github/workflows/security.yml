# ─────────────────────────────────────────────────────────────────────────────
# security.yml — Dependency & secret scanning (Scenario 5)
#
# Demonstrates a lightweight security gate that:
#   1. Audits npm dependencies for known vulnerabilities (npm audit)
#   2. Checks for hard-coded secrets using a simple grep pattern
#   3. Verifies no packages are on a mock "banned list"
#
# Workshop usage:
#   Participants add a dependency listed in the banned list (or paste a fake
#   secret), push to a branch, open a PR, and watch this workflow fail.
#   They then fix the issue and see it go green.
# ─────────────────────────────────────────────────────────────────────────────

name: Security Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # Run weekly so stale vulnerabilities are caught automatically
  schedule:
    - cron: '0 6 * * 1'

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm audit exits non-zero when high/critical vulnerabilities are found.
      # --audit-level=high means low/moderate issues are warnings, not failures.
      - name: Run npm audit
        run: npm audit --audit-level=high

      # ── Mock banned-package check ──────────────────────────────────────────
      # In a real pipeline this would call an internal policy service.
      # Here we grep package.json for a hardcoded list of banned packages.
      - name: Check for banned packages
        shell: bash
        run: |
          echo "Checking for banned packages..."

          BANNED_PACKAGES=("left-pad" "event-stream" "malicious-pkg")
          FOUND=0

          for pkg in "${BANNED_PACKAGES[@]}"; do
            if grep -q "\"$pkg\"" package.json; then
              echo "::error::Banned package detected: $pkg"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo "::error::Security check failed — remove banned packages before merging."
            exit 1
          fi

          echo "No banned packages found."

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so we can scan all commits on the branch
          fetch-depth: 0

      # Scan for common secret patterns (API keys, tokens, passwords in code).
      # This is a simplified grep — in production use truffleHog or gitleaks.
      - name: Scan for hard-coded secrets
        shell: bash
        run: |
          echo "Scanning for hard-coded secrets..."

          # Patterns to detect
          PATTERNS=(
            "password\s*=\s*['\"][^'\"]{6,}"
            "api[_-]?key\s*=\s*['\"][^'\"]{8,}"
            "secret\s*=\s*['\"][^'\"]{8,}"
            "AKIA[0-9A-Z]{16}"          # AWS Access Key pattern
          )

          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            # Exclude node_modules, .git, and this workflow file itself
            if grep -rE "$pattern" \
                --include="*.js" \
                --include="*.ts" \
                --include="*.json" \
                --exclude-dir=node_modules \
                --exclude-dir=.git \
                .; then
              echo "::error::Potential secret detected — pattern: $pattern"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo "::error::Secret scan failed. Remove secrets and use GitHub Secrets instead."
            exit 1
          fi

          echo "No secrets detected."

  # Aggregate job — required status check that gates the PR merge
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [dependency-audit, secret-scan]
    if: always()

    steps:
      - name: Evaluate results
        run: |
          if [[ "${{ needs.dependency-audit.result }}" != "success" || \
                "${{ needs.secret-scan.result }}" != "success" ]]; then
            echo "::error::One or more security checks failed. PR cannot be merged."
            exit 1
          fi
          echo "All security checks passed."
