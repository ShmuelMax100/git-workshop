# ─────────────────────────────────────────────────────────────────────────────
# advanced-ci.yml — Multi-job pipeline (Scenario 4 — Build a workflow)
#
# Demonstrates:
#   • Matrix builds across Node versions
#   • Dependency caching with actions/cache
#   • Job dependencies (`needs`)
#   • Passing outputs between jobs
#   • Conditional steps
#   • Environment variables and secrets reference (mocked)
# ─────────────────────────────────────────────────────────────────────────────

name: Advanced CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_deploy:
        description: 'Deploy after tests pass?'
        required: false
        default: 'false'
        type: boolean

# ── Job 1: Lint / static checks ───────────────────────────────────────────────
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Simulated lint step — replace with eslint/prettier in a real project
      - name: Check formatting (mock)
        run: |
          echo "Running format check..."
          echo "No formatting errors found."

# ── Job 2: Matrix test across Node versions ───────────────────────────────────
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    # Only run if lint passes
    needs: lint

    strategy:
      # Don't cancel other matrix entries when one fails
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    # Expose a job-level output so the deploy job can read the Node version used
    outputs:
      tested-version: ${{ steps.set-output.outputs.node }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Restore cached node_modules (key includes OS + Node version + lockfile hash)
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      # Pass the Node version forward as a job output
      - name: Set output
        id: set-output
        run: echo "node=${{ matrix.node-version }}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 5

# ── Job 3: Build summary ──────────────────────────────────────────────────────
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: test
    # Runs even if some test matrix entries failed
    if: always()

    steps:
      - name: Print summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Node versions tested | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 18.x, 20.x, 22.x   | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY

# ── Job 4: Mock deploy (only on main + all tests green) ───────────────────────
  deploy:
    name: Deploy (mock)
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Only deploy from main branch when all previous jobs succeed
    if: |
      github.ref == 'refs/heads/main' &&
      needs.test.result == 'success' &&
      (github.event_name == 'push' || inputs.run_deploy == true)

    environment:
      name: production
      url: https://example.com

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production (mock)
        env:
          # Reference a repository secret — replace with a real token in production
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "Deploying to production..."
          echo "Commit: ${{ github.sha }}"
          echo "Actor:  ${{ github.actor }}"
          # In a real workflow you would call your deployment script here:
          # ./scripts/deploy.sh --token "$DEPLOY_TOKEN"
          echo "Deploy complete (mock)"
