# ─────────────────────────────────────────────────────────────────────────────
# my-pipeline-complete.yml — SOLUTION for Scenario 4
#
# This is the complete version of the pipeline participants build step by step.
# Includes all bonus additions: deploy job + fail-fast: false + step summary table.
# ─────────────────────────────────────────────────────────────────────────────

name: My Pipeline (Complete)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Job 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Lint (mock)
        run: echo "Lint passed."

  # ── Job 2: Test matrix ──────────────────────────────────────────────────────
  test:
    name: Test (Node ${{ matrix.node-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # bonus: other matrix entries keep running even if one fails
      matrix:
        node-version: [18.x, 20.x]
    outputs:
      node: ${{ steps.out.outputs.node }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-
      - run: npm ci
      - run: npm run test:ci
      - id: out
        run: echo "node=${{ matrix.node-version }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.node-version }}
          path: coverage/

  # ── Job 3: Report ───────────────────────────────────────────────────────────
  report:
    name: Report
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Write step summary
        run: |
          echo "## Pipeline Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY

  # ── Job 4: Deploy (bonus) ───────────────────────────────────────────────────
  deploy:
    name: Deploy (mock)
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' &&
      needs.test.result == 'success'
    steps:
      - name: Deploy
        run: |
          echo "Deploying commit ${{ github.sha }}..."
          echo "Deploy complete."
